<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Micromercado La 40 – Iniciar sesión</title>
  <link rel="stylesheet" href="src/frotned/style/login.css" />
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet"/>
</head>
<body>

  <!-- ===== FONDO DECORATIVO ===== -->
  <div class="bg-blob blob-top-left"></div>
  <div class="bg-blob blob-bottom-left"></div>

  <!-- ===== HOJA DECORATIVA IZQUIERDA ===== -->
  <div class="leaf-deco leaf-top">
    <svg viewBox="0 0 220 380" xmlns="http://www.w3.org/2000/svg">
      <path d="M110 360 C60 280 10 200 40 110 C60 50 130 10 160 60 C200 120 180 230 110 360Z" fill="#a8c5a0" opacity="0.45"/>
      <path d="M90 340 C50 260 20 180 55 100 C75 45 140 20 165 75 C195 135 170 240 90 340Z" fill="#c5dbbe" opacity="0.35"/>
      <path d="M130 350 C85 275 55 195 80 115 C100 60 165 30 185 80 C210 140 185 245 130 350Z" fill="#8db88a" opacity="0.30"/>
    </svg>
  </div>
  <div class="leaf-deco leaf-bottom">
    <svg viewBox="0 0 200 320" xmlns="http://www.w3.org/2000/svg">
      <path d="M100 10 C55 80 10 160 35 250 C55 310 130 340 155 290 C185 230 165 130 100 10Z" fill="#a8c5a0" opacity="0.45"/>
      <path d="M80 20 C40 90 15 170 45 255 C65 310 135 335 158 285 C185 225 160 125 80 20Z" fill="#c5dbbe" opacity="0.30"/>
    </svg>
  </div>

  <!-- ===== CONTENEDOR PRINCIPAL ===== -->
  <main class="layout">

    <!-- ---- PANEL IZQUIERDO (marca) ---- -->
    <section class="brand-panel">
      <img src="../../img/Logo1.png" alt="Logo Micromercado La 40" class="logo" style="width: 400px; margin-left: 40px;"/>
    </section>

    <!-- ---- PANEL DERECHO (formulario) ---- -->
    <section class="form-panel">
      <div class="form-card">

        <div class="form-header">
          <div class="avatar-icon">
            <svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
              <circle cx="24" cy="18" r="9" stroke="#9cbbad" stroke-width="2.2" fill="none"/>
              <path d="M8 42 C8 32 40 32 40 42" stroke="#9cbbad" stroke-width="2.2" fill="none" stroke-linecap="round"/>
            </svg>
          </div>
          <h2 class="form-title">Bienvenido</h2>
          <p class="form-subtitle">Sistema de Gestión de Inventario</p>
        </div>

        <div class="form-body">
          <div class="field-group">
            <label for="usuario">Usuario</label>
            <div class="input-wrap">
              <span class="input-icon">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                  <circle cx="12" cy="8" r="4" stroke="#9cbbad" stroke-width="1.8" fill="none"/>
                  <path d="M4 20 C4 15 20 15 20 20" stroke="#9cbbad" stroke-width="1.8" fill="none" stroke-linecap="round"/>
                </svg>
              </span>
              <input type="text" id="usuario" placeholder="Ingresa tu usuario" autocomplete="username"/>
            </div>
          </div>

          <div class="field-group">
            <label for="contrasena">Contraseña</label>
            <div class="input-wrap">
              <span class="input-icon">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                  <rect x="5" y="11" width="14" height="10" rx="2" stroke="#9cbbad" stroke-width="1.8" fill="none"/>
                  <path d="M8 11 V8 a4 4 0 0 1 8 0 v3" stroke="#9cbbad" stroke-width="1.8" fill="none"/>
                </svg>
              </span>
              <input type="password" id="contrasena" placeholder="Ingresa tu contraseña" autocomplete="current-password"/>
              <button type="button" class="toggle-pass" id="togglePass" aria-label="Mostrar/ocultar contraseña">
                <svg id="eyeIcon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                  <path d="M1 12 C4 6 20 6 23 12 C20 18 4 18 1 12Z" stroke="#9cbbad" stroke-width="1.8" fill="none"/>
                  <circle cx="12" cy="12" r="3" stroke="#9cbbad" stroke-width="1.8" fill="none"/>
                </svg>
              </button>
            </div>
          </div>

          <div class="form-options">
            <label class="check-label">
              <input type="checkbox" id="recordarme"/>
              <span class="check-custom"></span>
              Recordarme
            </label>
            <a href="#" class="forgot-link">¿Olvidaste tu contraseña?</a>
          </div>

          <button type="button" class="btn-login" id="btnLogin">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4" stroke="white" stroke-width="2" fill="none" stroke-linecap="round"/>
              <polyline points="10 17 15 12 10 7" stroke="white" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
              <line x1="15" y1="12" x2="3" y2="12" stroke="white" stroke-width="2" stroke-linecap="round"/>
            </svg>
            Iniciar sesión
          </button>

          <div class="login-feedback" id="loginFeedback"></div>
        </div>

      </div>

      <p style="padding-right: 80px;;" class="footer-copy">© 2025 Micromercado La 40. Todos los derechos reservados.</p>
    </section>

  </main>

  <script src="src/backend/login.js"></script>
</body>
</html>
